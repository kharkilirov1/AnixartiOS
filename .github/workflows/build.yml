name: Build Anixart (APK + IPA)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create platform scaffolding (android/ ios/)
        run: flutter create . --platforms ios,android --org com.kharki --project-name anixart

      - name: Ensure INTERNET permission (Android release)
        run: |
          python3 - <<'EOF'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
              open(p, 'w').write(s)
          print('manifest ok')
          EOF

      - name: Apply stable release signing (Android)
        run: |
          cp android_signing/anixart-release.jks android/app/
          cp android_signing/key.properties android/
          python3 - <<'EOF'
          import glob
          path = glob.glob('android/app/build.gradle*')[0]
          s = open(path).read()
          s = s.replace('signingConfig = signingConfigs.debug', 'signingConfig = signingConfigs.release')
          s = s.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')
          s = s.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
          # Kotlin DSL: fresh templates have no release signingConfig - create it
          if 'signingConfigs {' not in s and 'signingConfigs.create' not in s:
              block = '''signingConfigs {
                create("release") {
                    keyAlias = keystoreProperties["keyAlias"] as String?
                    keyPassword = keystoreProperties["keyPassword"] as String?
                    storeFile = keystoreProperties["storeFile"]?.let { file(it) }
                    storePassword = keystoreProperties["storePassword"] as String?
                }
            }

            '''
              s = s.replace('buildTypes {', block + 'buildTypes {', 1)
          open(path, 'w').write(s)
          print('patched', path)
          for line in s.splitlines():
              if 'signingConfig' in line or 'signingConfigs' in line:
                  print(line.strip())
          EOF

      - name: flutter pub get
        run: flutter pub get

      - name: Build APK (release, debug-signed → installable)
        run: flutter build apk --release

      - name: Build debug APK (diagnostics)
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Anixart-apk-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Build iOS app (unsigned)
        run: flutter build ipa --no-codesign --release

      - name: Package unsigned IPA (for AltStore/Sideloadly)
        run: |
          APP_PATH=$(find build/ios/archive -name 'Runner.app' -type d | head -1)
          if [ -z "$APP_PATH" ]; then echo "Runner.app not found"; exit 1; fi
          rm -rf Payload Anixart.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/Runner.app
          mv Payload/Runner.app Payload/Anixart.app
          zip -qr Anixart.ipa Payload
          ls -la Anixart.ipa

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Anixart-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Anixart-ipa
          path: Anixart.ipa
          if-no-files-found: error
